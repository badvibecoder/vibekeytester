<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="vibekeytester logo">
  <defs>
    <linearGradient id="vkt-sun" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd319"/>
      <stop offset="0.45" stop-color="#ff9e00"/>
      <stop offset="0.75" stop-color="#ff2975"/>
      <stop offset="1" stop-color="#ff2d95"/>
    </linearGradient>
    <linearGradient id="vkt-ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#00e5ff"/>
      <stop offset="1" stop-color="#b967ff"/>
    </linearGradient>
  </defs>
  <circle cx="32" cy="32" r="30" fill="none" stroke="url(#vkt-ring)" stroke-width="2" opacity="0.85"/>
  <circle cx="32" cy="32" r="22.5" fill="url(#vkt-sun)"/>
  <!-- three rows of mini keycaps forming the keyboard glyph -->
  <g fill="#0b0416">
    <rect x="12" y="17" width="8" height="5.6" rx="1"/>
    <rect x="22" y="17" width="8" height="5.6" rx="1"/>
    <rect x="32" y="17" width="8" height="5.6" rx="1"/>
    <rect x="42" y="17" width="10" height="5.6" rx="1"/>

    <rect x="12" y="24.6" width="11" height="5.6" rx="1"/>
    <rect x="25" y="24.6" width="8" height="5.6" rx="1"/>
    <rect x="35" y="24.6" width="8" height="5.6" rx="1"/>
    <rect x="45" y="24.6" width="7" height="5.6" rx="1"/>

    <rect x="12" y="32.2" width="13" height="5.6" rx="1"/>
    <rect x="27" y="32.2" width="8" height="5.6" rx="1"/>
    <rect x="37" y="32.2" width="8" height="5.6" rx="1"/>
    <rect x="47" y="32.2" width="5" height="5.6" rx="1"/>

    <rect x="12" y="39.8" width="8" height="5.6" rx="1"/>
    <rect x="22" y="39.8" width="8" height="5.6" rx="1"/>
    <rect x="32" y="39.8" width="20" height="5.6" rx="1"/>
  </g>
